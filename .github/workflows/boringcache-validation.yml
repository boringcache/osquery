name: BoringCache Linux build validation

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Cache phase
        required: true
        type: choice
        options: [connect, cold, warm, rolling]

permissions:
  contents: read
  id-token: write

concurrency:
  group: osquery-cache-validation
  cancel-in-progress: false

jobs:
  connect:
    if: inputs.phase == 'connect' && github.repository == 'boringcache/osquery' && github.ref == 'refs/heads/boringcache-validation'
    runs-on: ubuntu-22.04
    steps:
      - name: Install BoringCache CLI
        run: |
          curl -fsSL https://install.boringcache.com/install.sh -o "$RUNNER_TEMP/install-boringcache.sh"
          sh "$RUNNER_TEMP/install-boringcache.sh"
          printf '%s/.local/bin\n' "$HOME" >> "$GITHUB_PATH"
      - name: Connect GitHub OIDC
        run: boringcache ci connect --oidc-provider github-actions

  build:
    if: inputs.phase != 'connect' && github.repository == 'boringcache/osquery' && github.ref == 'refs/heads/boringcache-validation'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        provider: [github, boringcache]
    env:
      CCACHE_DIR: ${{ github.workspace }}/workspace/ccache
      CCACHE_MAXSIZE: 5G
      OSQUERY_TOOLCHAIN_VERSION: 1.2.0
    steps:
      - name: Checkout validation plan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: operator
          persist-credentials: false

      - name: Select upstream source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(cat operator/.github/boringcache-upstream)
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/validation"
          printf '%s\n' "$source_sha" > "$RUNNER_TEMP/validation/upstream-sha.txt"
          printf '%s\n' "${GITHUB_SHA}" > "$RUNNER_TEMP/validation/workflow-sha.txt"
          printf '%s\n' "${{ inputs.phase }}" > "$RUNNER_TEMP/validation/phase.txt"
          uname -a > "$RUNNER_TEMP/validation/runner.txt"

      - name: Make room for the Linux build
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h

      - name: Install osquery toolchain
        shell: bash
        run: |
          archive="osquery-toolchain-${OSQUERY_TOOLCHAIN_VERSION}-$(uname -m).tar.xz"
          curl --fail --location --retry 5 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/osquery/osquery-toolchain/releases/download/${OSQUERY_TOOLCHAIN_VERSION}/$archive"
          sudo tar xf "$RUNNER_TEMP/$archive" -C /usr/local

      - name: Install upstream Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            elfutils python3-psutil python3-six python3-wheel linux-headers-generic
          cmake --version | head -1

      - name: Install ccache
        shell: bash
        env:
          CCACHE_VERSION: '4.14'
          CCACHE_SHA256: c64760b0b85ba86068f4cd162dc42e2dc39c6f46b0cb8c1990dfccbec7a1fed0
        run: |
          archive="ccache-${CCACHE_VERSION}-linux-x86_64-glibc.tar.gz"
          curl --fail --location --retry 5 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/$archive"
          echo "${CCACHE_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          tar xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/ccache-${CCACHE_VERSION}-linux-x86_64-glibc/ccache" \
            /usr/local/bin/ccache
          ccache --version | head -1

      - name: Install BoringCache ccache HTTP helper
        if: matrix.provider == 'boringcache'
        shell: bash
        env:
          HELPER_VERSION: '0.10'
          HELPER_SHA256: 88963ef2cc21ca588145d46bcb02b8295275975ed75696eedf2cdb0e9543edd0
        run: |
          archive="ccache-storage-http-go-${HELPER_VERSION}-linux-amd64.tar.gz"
          curl --fail --location --retry 5 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/ccache/ccache-storage-http-go/releases/download/v${HELPER_VERSION}/$archive"
          echo "${HELPER_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          tar xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          sudo install -m 0755 \
            "$RUNNER_TEMP/ccache-storage-http-go-${HELPER_VERSION}-linux-amd64/ccache-storage-http" \
            /usr/local/bin/ccache-storage-http

      - name: Prepare upstream build paths
        id: paths
        shell: bash
        run: |
          source_path="$GITHUB_WORKSPACE/workspace/padding-required-by-rpm-packages/src"
          build_path="$GITHUB_WORKSPACE/workspace/usr/src/debug/osquery/build"
          mkdir -p "$source_path" "$build_path" "$CCACHE_DIR"
          printf 'source=%s\nbuild=%s\n' "$source_path" "$build_path" >> "$GITHUB_OUTPUT"

      - name: Checkout replayed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: workspace/padding-required-by-rpm-packages/src
          persist-credentials: false

      - name: Verify upstream source and configure ccache
        shell: bash
        run: |
          test "$(git -C '${{ steps.paths.outputs.source }}' rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(cat '${{ steps.paths.outputs.source }}/.github/boringcache-upstream')" = '${{ steps.source.outputs.sha }}'
          printf 'CCACHE_CONFIGPATH=%s/ccache.conf\n' '${{ steps.paths.outputs.source }}' >> "$GITHUB_ENV"
          git -C '${{ steps.paths.outputs.source }}' submodule status --recursive \
            > "$RUNNER_TEMP/validation/submodules.txt"

      - name: Restore GitHub ccache
        if: matrix.provider == 'github'
        id: github_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.0.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: osquery-linux-amd64-release-ccache-${{ steps.source.outputs.sha }}
          restore-keys: osquery-linux-amd64-release-ccache-

      - name: Start BoringCache ccache
        if: matrix.provider == 'boringcache'
        id: boringcache
        uses: boringcache/one@f0fb9b2d926a32b10c543e92093ba00c5a291b79 # v1.33.0
        with:
          working-directory: operator
          mode: ccache
          trust-policy: ${{ inputs.phase == 'warm' && 'restore' || 'publish' }}
          diagnostics: summary
          fail-on-cache-error: true
          save-always: true

      - name: Configure upstream Linux Release build
        working-directory: ${{ steps.paths.outputs.build }}
        shell: bash
        run: |
          cmake -G 'Unix Makefiles' \
            -DOSQUERY_NO_DEBUG_SYMBOLS=OFF \
            -DOSQUERY_TOOLCHAIN_SYSROOT:PATH=/usr/local/osquery-toolchain \
            -DCMAKE_BUILD_TYPE:STRING=Release \
            -DOSQUERY_BUILD_TESTS=ON \
            -DOSQUERY_BUILD_ROOT_TESTS=ON \
            '${{ steps.paths.outputs.source }}'

      - name: Build upstream Linux Release target
        working-directory: ${{ steps.paths.outputs.build }}
        shell: bash
        run: |
          ccache --zero-stats
          started=$SECONDS
          cmake --build . -j "$(($(nproc) + 1))"
          printf 'build_seconds=%s\n' "$((SECONDS - started))" \
            > "$RUNNER_TEMP/validation/timing.txt"
          ccache --show-stats | tee "$RUNNER_TEMP/validation/ccache-stats.txt"
          du -sh "$CCACHE_DIR" '${{ steps.paths.outputs.build }}' \
            > "$RUNNER_TEMP/validation/size.txt"

      - name: Save GitHub ccache
        if: matrix.provider == 'github' && inputs.phase != 'warm'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.0.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: osquery-linux-amd64-release-ccache-${{ steps.source.outputs.sha }}

      - name: Retain build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.provider }}-${{ inputs.phase }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/validation
            ${{ steps.boringcache.outputs.evidence-path }}
          retention-days: 30
